<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Timothy Kim — Applied Math and Statistics student building intelligent products, simulation environments, and data-driven decision tools.">
  <title>Timothy Kim — Software, Data & ML</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Primary navigation">
      <a class="logo" href="#top" aria-label="Timothy Kim, home"><span id="logoInitials">TK</span><span id="siteName">Timothy Kim</span></a>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="navLinks">Menu</button>
      <div class="nav-links" id="navLinks">
        <a href="#projects" data-label="projects">Projects</a>
        <a href="#experience" data-label="experience">Experience</a>
        <a href="#skills" data-label="skills">Skills</a>
        <a href="#contact" data-label="contact">Contact</a>
      </div>
    </nav>
  </header>

  <main id="top">
    <section class="hero" aria-label="Introduction">
      <div class="hero-copy reveal">
        <p class="kicker" id="introText"></p>
        <p class="hero-description" id="summaryText"></p>
        <div class="button-row">
          <a class="button button-dark" href="#projects"><span id="primaryCta"></span><span aria-hidden="true">↓</span></a>
        </div>
      </div>
    </section>

    <section class="projects section-shell" id="projects" aria-labelledby="projects-title">
      <div class="section-label reveal">
        <h2 id="projects-title"></h2>
      </div>

      <article class="featured-card reveal" id="featuredProject"></article>
      <button class="subsection-label subsection-toggle reveal" type="button" aria-expanded="true" aria-controls="projectGrid">
        <span id="moreProjectsLabel"></span>
        <span class="subsection-toggle-icon" aria-hidden="true">+</span>
      </button>
      <div class="project-grid" id="projectGrid"></div>
    </section>

    <section class="experience section-shell" id="experience" aria-labelledby="experience-title">
      <div class="section-label reveal">
        <h2 id="experience-title"></h2>
      </div>
      <div class="experience-groups reveal" id="experienceList"></div>
    </section>

    <section class="skills section-shell" id="skills" aria-labelledby="skills-title">
      <div class="section-label reveal">
        <h2 id="skills-title"></h2>
      </div>
      <div class="skills-grid reveal" id="skillsList"></div>
    </section>

    <section class="contact section-shell" id="contact" aria-labelledby="contact-title">
      <div class="section-label reveal">
        <h2 id="contact-title"></h2>
      </div>
      <div class="contact-links reveal" id="contactLinks"></div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span id="footerName"></span></p>
    <a href="#top">Back to top ↑</a>
  </footer>

  <div class="project-modal" id="projectModal" hidden aria-hidden="true">
    <div class="project-modal-backdrop" data-modal-close></div>
    <section class="project-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalProjectTitle" aria-describedby="modalProjectDescription">
      <header class="project-modal-header">
        <div>
          <p class="project-type">Project details</p>
          <h2 id="modalProjectTitle"></h2>
          <div class="project-modal-summary-row">
            <p id="modalProjectDescription"></p>
            <a class="button button-dark project-modal-link" id="modalProjectLink" href="#" target="_blank" rel="noreferrer" hidden></a>
          </div>
        </div>
        <button class="project-modal-close" type="button" aria-label="Close project details" data-modal-close>×</button>
      </header>
      <div class="project-modal-tabs" role="tablist" aria-label="Project detail sections">
        <button type="button" role="tab" id="featureTab" aria-controls="featurePanel" aria-selected="true" data-detail-tab="feature">Feature decisions</button>
        <button type="button" role="tab" id="codeTab" aria-controls="codePanel" aria-selected="false" tabindex="-1" data-detail-tab="code">Code details</button>
      </div>
      <div class="project-modal-panel" id="featurePanel" role="tabpanel" aria-labelledby="featureTab"></div>
      <div class="project-modal-panel" id="codePanel" role="tabpanel" aria-labelledby="codeTab" hidden></div>
    </section>
  </div>

  <div class="draft-toast" role="status" aria-live="polite">Send me the destination URL and I’ll connect this button.</div>
  <noscript>This portfolio requires JavaScript to load its content.</noscript>
  <script src="script.js"></script>

  <!-- Cloudflare Web Analytics -->
  <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "30b4c2346c0d4754bc329dab032db3ac"}'></script>
  <!-- End Cloudflare Web Analytics -->
</body>
</html>
